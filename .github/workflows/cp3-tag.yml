name: Marcar entrega CP3
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publicar-tag:
    if: contains(github.event.head_commit.message, '[cp3-entrega]')
    runs-on: ubuntu-latest
    steps:
      - name: Baixar historico
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Criar tag cp3-entrega se ainda nao existir
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/cp3-entrega >/dev/null 2>&1; then
            echo "A tag ja existe; nao sera alterada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a cp3-entrega -m "Entrega CP3: versao final do CronoTech"
          git push origin refs/tags/cp3-entrega

