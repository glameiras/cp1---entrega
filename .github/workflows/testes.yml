name: Validar quiz CP3
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar navegador de testes
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Testar fluxo e responsividade
        run: |
          python3 -m http.server 8765 --directory dist > /tmp/cronotech-http.log 2>&1 &
          node tests/quiz.cjs
